[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reeeq"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = []
authors = [
  { name = "aikwen", email = "kwen.zou@outlook.com" },
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

dependencies = []

[project.urls]
Documentation = "https://github.com/aikwen/reeeq#readme"
Issues = "https://github.com/aikwen/reeeq/issues"
Source = "https://github.com/aikwen/reeeq"

[tool.hatch.version]
path = "src/reeeq/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/reeeq tests}"

[tool.coverage.run]
source_pkgs = ["reeeq", "tests"]
branch = true
parallel = true
omit = [
  "src/reeeq/__about__.py",
]

[tool.coverage.paths]
reeeq = ["src/reeeq", "*/reeeq/src/reeeq"]
tests = ["tests", "*/reeeq/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
